name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7
        with:
          root: .

      - name: Validate CSS
        run: |
          sudo apt-get update
          sudo apt-get install -y csslint
          find css -name "*.css" -print0 | xargs -0 -n1 csslint || true
